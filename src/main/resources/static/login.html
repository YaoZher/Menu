<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f5ef"><title>审核登录 · 一方菜单</title><link rel="icon" href="/assets/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/style.css"><script type="module" src="/assets/login.js"></script></head>
<body class="login-page"><header class="site-header wrap"><a class="brand" href="/"><img src="/assets/mark.svg" width="38" height="38" alt=""><span>一方菜单<small>GOOD FOOD, GOOD DAYS</small></span></a><a class="subtle-link" href="/">返回菜单 <span aria-hidden="true">↗</span></a></header><main class="login-main"><div class="login-story"><span class="eyebrow">A LITTLE CARE GOES A LONG WAY</span><h1>好味道，<br>也需要<span class="accent-word">用心守护。</span></h1><p>每一份分享背后，都是对生活的热爱。<br>谢谢你，让这一方菜单更美好。</p><img src="/assets/table.svg" alt="" aria-hidden="true"></div><section class="login-card" aria-labelledby="login-title"><span class="dialog-symbol"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#lock"/></svg></span><div class="eyebrow muted">REVIEW WORKSPACE</div><h2 id="login-title">欢迎回来</h2><p class="dialog-intro">登录审核工作台，照料每一份分享。</p><p class="notice" id="login-notice" hidden>登录已过期，请重新登录后继续。</p><form id="login-form"><div class="form-stack"><div class="field"><label for="username">管理员账号</label><input id="username" name="username" autocomplete="username" required maxlength="100" placeholder="请输入账号"></div><div class="field"><label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="请输入密码"><button type="button" id="password-toggle" class="icon-button" aria-label="显示密码" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#eye"/></svg></button></div></div></div><p id="login-error" class="form-error" role="alert" hidden></p><button class="button primary login-submit" id="login-submit" type="submit">登录工作台 <span aria-hidden="true">→</span></button></form><p class="login-footnote"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#lock"/></svg>仅限授权管理员访问</p></section></main><footer class="site-footer wrap"><span>一方菜单<span class="footer-divider">/</span>把日子过成喜欢的味道。</span><span>MADE FOR EVERYDAY MOMENTS</span></footer><div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div></body></html>
