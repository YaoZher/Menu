server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: menu
  datasource:
    url: jdbc:h2:file:${MENU_DATA_PATH:./data/menu};DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${MENU_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
app:
  admin:
    username: ${MENU_ADMIN_USERNAME:admin}
    password: ${MENU_ADMIN_PASSWORD:}
  rate-limit:
    enabled: true
